name: Deploy to GCP
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    # Lets GITHUB_TOKEN fetch this repo from the VM (see the git fetch below).
    permissions:
      contents: read
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          envs: GH_TOKEN,GH_REPO,SMTP_HOST,SMTP_PORT,SMTP_USE_SSL,SMTP_USER,SMTP_PASSWORD,SUPPORT_EMAIL,GROQ_API_KEY,GROQ_MODEL,NEXT_PUBLIC_API_URL,NEXT_PUBLIC_APP_URL,LIVE_INVENTORY_API_URL,LIVE_INVENTORY_API_KEY,LIVE_INVENTORY_TIMEOUT_MS,DISABLE_LOCAL_FALLBACK,STRICT_LIVE_INVENTORY_ONLY,GOOGLE_PLACES_API_KEY
          script_stop: true
          command_timeout: 15m
          script: |
            cd /var/www/zoikomeds
            # Fetch with this run's short-lived token instead of whatever
            # credential the VM has stored. The stored one expired, so every
            # deploy died on "could not read Username for 'https://github.com'"
            # and the site silently stayed on an old build. The token is never
            # written to .git/config because the URL is passed inline.
            git fetch "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" main
            git reset --hard FETCH_HEAD
            cat << EOF > .env
            SMTP_HOST=$SMTP_HOST
            SMTP_PORT=$SMTP_PORT
            SMTP_USE_SSL=$SMTP_USE_SSL
            SMTP_USER=$SMTP_USER
            SMTP_PASSWORD=$SMTP_PASSWORD
            SUPPORT_EMAIL=$SUPPORT_EMAIL
            NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
            NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL
            GROQ_API_KEY=$GROQ_API_KEY
            GROQ_MODEL=$GROQ_MODEL
            LIVE_INVENTORY_API_URL=$LIVE_INVENTORY_API_URL
            LIVE_INVENTORY_API_KEY=$LIVE_INVENTORY_API_KEY
            LIVE_INVENTORY_TIMEOUT_MS=$LIVE_INVENTORY_TIMEOUT_MS
            DISABLE_LOCAL_FALLBACK=$DISABLE_LOCAL_FALLBACK
            STRICT_LIVE_INVENTORY_ONLY=$STRICT_LIVE_INVENTORY_ONLY
            GOOGLE_PLACES_API_KEY=$GOOGLE_PLACES_API_KEY
            EOF
            npm install
            npm run build
            pm2 restart zoikomeds
        env:
          # Scoped to this repo and expires with the job, so nothing long-lived
          # has to live on the VM.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
          # Must be the backend that owns the accounts, since the same backend
          # mints reset tokens and emails links back to this site. `envs:`
          # exports this into the remote shell, where it overrides every .env
          # file at build time — so this default wins unless the secret is set.
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://get.zoikomeds.com/api' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://zoiko-meds-platform.vercel.app' }}
          LIVE_INVENTORY_API_URL: ${{ secrets.LIVE_INVENTORY_API_URL || 'https://api.zoikomeds.com/v1/live-inventory' }}
          LIVE_INVENTORY_API_KEY: ${{ secrets.LIVE_INVENTORY_API_KEY }}
          LIVE_INVENTORY_TIMEOUT_MS: ${{ secrets.LIVE_INVENTORY_TIMEOUT_MS || '3000' }}
          DISABLE_LOCAL_FALLBACK: ${{ secrets.DISABLE_LOCAL_FALLBACK || 'false' }}
          STRICT_LIVE_INVENTORY_ONLY: ${{ secrets.STRICT_LIVE_INVENTORY_ONLY || 'true' }}
          # Without this, lib/geocoding.ts silently falls back to Nominatim,
          # which rate-limits requests from cloud IPs. Add the repo secret.
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}

