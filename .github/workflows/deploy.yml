name: Deploy to GCP
on:
  push:
    branches: [main]
concurrency:
  group: deploy-gcp
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          envs: SMTP_HOST,SMTP_PORT,SMTP_USE_SSL,SMTP_USER,SMTP_PASSWORD,SMTP_FROM_ADDRESS,SMTP_FROM_NAME,APP_TIMEZONE,SUPPORT_EMAIL,GROQ_API_KEY,GROQ_MODEL,NEXT_PUBLIC_API_URL,NEXT_PUBLIC_APP_URL,LIVE_INVENTORY_API_URL,LIVE_INVENTORY_API_KEY,LIVE_INVENTORY_TIMEOUT_MS,DISABLE_LOCAL_FALLBACK,STRICT_LIVE_INVENTORY_ONLY,GOOGLE_PLACES_API_KEY,PLATFORM_SERVICE_EMAIL,PLATFORM_SERVICE_PASSWORD
          script_stop: true
          command_timeout: 15m
          script: |
            cd /var/www/zoikomeds
            git fetch origin main
            git reset --hard origin/main
            cat << EOF > .env
            SMTP_HOST=$SMTP_HOST
            SMTP_PORT=$SMTP_PORT
            SMTP_USE_SSL=$SMTP_USE_SSL
            SMTP_USER=$SMTP_USER
            SMTP_PASSWORD=$SMTP_PASSWORD
            SMTP_FROM_ADDRESS=$SMTP_FROM_ADDRESS
            SMTP_FROM_NAME=$SMTP_FROM_NAME
            APP_TIMEZONE=$APP_TIMEZONE
            SUPPORT_EMAIL=$SUPPORT_EMAIL
            NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
            NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL
            GROQ_API_KEY=$GROQ_API_KEY
            GROQ_MODEL=$GROQ_MODEL
            LIVE_INVENTORY_API_URL=$LIVE_INVENTORY_API_URL
            LIVE_INVENTORY_API_KEY=$LIVE_INVENTORY_API_KEY
            LIVE_INVENTORY_TIMEOUT_MS=$LIVE_INVENTORY_TIMEOUT_MS
            DISABLE_LOCAL_FALLBACK=$DISABLE_LOCAL_FALLBACK
            STRICT_LIVE_INVENTORY_ONLY=$STRICT_LIVE_INVENTORY_ONLY
            GOOGLE_PLACES_API_KEY=$GOOGLE_PLACES_API_KEY
            PLATFORM_SERVICE_EMAIL=$PLATFORM_SERVICE_EMAIL
            PLATFORM_SERVICE_PASSWORD=$PLATFORM_SERVICE_PASSWORD
            EOF
            # This file is recreated on every deploy, so an unset GitHub secret
            # silently becomes an empty value here. Name the empty ones (never
            # their values) so a broken mail config is visible in the log
            # instead of showing up as forms that quietly stop emailing.
            for required in SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASSWORD; do
              if ! grep -q "^${required}=." .env; then
                echo "WARNING: ${required} is empty in .env — outbound email will be disabled."
              fi
            done
            if [ -n "$GOOGLE_PLACES_API_KEY" ]; then
              echo "GOOGLE_PLACES_API_KEY configured: yes"
            else
              echo "GOOGLE_PLACES_API_KEY configured: no"
            fi
            if [ -z "$PLATFORM_SERVICE_EMAIL" ] || [ -z "$PLATFORM_SERVICE_PASSWORD" ]; then
              echo "WARNING: PLATFORM_SERVICE_EMAIL/PASSWORD is empty in .env — pharmacy-claim membership verification will fail closed (503) for every claim on a registered pharmacy."
            fi
            npm install
            # Prescription OCR reads its language model from disk. The file is
            # normally committed under public/tessdata; fetch it once here so a
            # deploy can never leave the scanner without a model (and so OCR
            # never depends on a download at request time).
            if [ ! -f public/tessdata/eng.traineddata.gz ]; then
              mkdir -p public/tessdata
              curl -fsSL --retry 3 -o public/tessdata/eng.traineddata.gz https://raw.githubusercontent.com/naptha/tessdata/gh-pages/4.0.0_best/eng.traineddata.gz
            fi
            rm -f .next/lock
            npm run build
            pm2 restart zoikomeds

            echo "Waiting for app to come back up..."
            sleep 5

            echo "=== Post-deploy smoke test: platform admin credential ==="
            # This exact credential broke silently twice (once from a $-in-password
            # dotenv-expand bug, once from a stale secret after a password rotation).
            # Both failures were invisible until a real user hit a 503. Fail the
            # deploy loudly instead of finding out from a support message.
            LOGIN_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$NEXT_PUBLIC_API_URL/auth/login" \
              -H "Content-Type: application/json" \
              -d "{\"email\":\"$PLATFORM_SERVICE_EMAIL\",\"password\":\"$PLATFORM_SERVICE_PASSWORD\"}")
            if [ "$LOGIN_STATUS" != "200" ]; then
              echo "::error::PLATFORM_SERVICE_EMAIL/PASSWORD login failed (HTTP $LOGIN_STATUS) after deploy. Pharmacy-claim membership verification will fail closed (503) for every claim until this is fixed. Check the GitHub Secret matches the account's current password, and that the value has no unescaped \$ characters."
              exit 1
            fi
            echo "Platform admin credential OK (HTTP $LOGIN_STATUS)"

            echo "=== Post-deploy smoke test: marketing site is actually serving ==="
            HOME_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://zoikomeds.com")
            if [ "$HOME_STATUS" != "200" ]; then
              echo "::error::zoikomeds.com returned HTTP $HOME_STATUS after deploy/restart."
              exit 1
            fi
            echo "Site is up (HTTP $HOME_STATUS)"
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # Optional. Without them the From header falls back to SMTP_USER.
          SMTP_FROM_ADDRESS: ${{ secrets.SMTP_FROM_ADDRESS }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME || 'ZoikoMeds' }}
          # Formatting fallback when a visitor's browser sends no timezone.
          APP_TIMEZONE: ${{ secrets.APP_TIMEZONE || 'UTC' }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.zoikomeds.com/api' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://app.zoikomeds.com' }}
          LIVE_INVENTORY_API_URL: ${{ secrets.LIVE_INVENTORY_API_URL || 'https://api.zoikomeds.com/v1/live-inventory' }}
          LIVE_INVENTORY_API_KEY: ${{ secrets.LIVE_INVENTORY_API_KEY }}
          LIVE_INVENTORY_TIMEOUT_MS: ${{ secrets.LIVE_INVENTORY_TIMEOUT_MS || '3000' }}
          DISABLE_LOCAL_FALLBACK: ${{ secrets.DISABLE_LOCAL_FALLBACK || 'false' }}
          STRICT_LIVE_INVENTORY_ONLY: ${{ secrets.STRICT_LIVE_INVENTORY_ONLY || 'true' }}
          # Without this, lib/geocoding.ts silently falls back to Nominatim,
          # which rate-limits requests from cloud IPs. Add the repo secret.
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          # Platform admin credential used to resolve pharmacy-claim membership
          # (see lib/pharmacyMembership.ts). Without these, every claim on an
          # already-registered pharmacy fails closed with a 503.
          PLATFORM_SERVICE_EMAIL: ${{ secrets.PLATFORM_SERVICE_EMAIL }}
          PLATFORM_SERVICE_PASSWORD: ${{ secrets.PLATFORM_SERVICE_PASSWORD }}
